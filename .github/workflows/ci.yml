name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate channel profiles
        run: npm run profile:validate

      - name: Test editorial core
        run: npm run test:editorial

      - name: Test bootstrap contract
        run: npm run test:bootstrap

      - name: Test topic intelligence shadow mode
        run: npm run test:shadow

      - name: Test research intelligence layer
        run: npm run test:research

      - name: Test editorial packaging assist
        run: npm run test:packaging

      - name: Test narrative scene blueprint
        run: npm run test:narrative

      - name: Test upstream core
        run: npm test
